name: CI/CD Pipeline - Python App via Tailscale

# Se activa automáticamente al hacer push a la rama main
on:
  push:
    branches: ["main"]

# Permisos para publicar la imagen en GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: CONSTRUIR LA IMAGEN Y SUBIRLA A GHCR
  # ------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos/etiquetas para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/bot-python
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Construir y Subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ------------------------------------------------------------------
  # JOB 2: CONECTAR A TU PC VÍA TAILSCALE Y DESPLEGAR
  # ------------------------------------------------------------------
  deploy:
    needs: build-and-push # Espera a que la imagen se suba con éxito
    runs-on: ubuntu-latest
    steps:
      - name: Conectar a la VPN de Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Ejecutar despliegue vía SSH en tu PC local
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }} # 100.100.38.4
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Ve a la carpeta donde tienes tu docker-compose.yml en tu PC
            # REEMPLAZA ESTA RUTA por la ruta absoluta de tu carpeta local
            cd /opt/apps/tg-dw-bot

            # 2. Iniciar sesión en GHCR desde tu PC para descargar la imagen
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. Descargar la imagen nueva
            docker compose pull

            # 4. Levantar/Actualizar los contenedores en segundo plano
            docker compose up -d

            # 5. Limpiar imágenes obsoletas para ahorrar espacio en disco
            docker image prune -f
