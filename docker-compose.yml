version: "3.8"

services:
  bot:
    build: .
    image: ghcr.io/brictp/peaky-puller/bot-python:latest
    container_name: peaky-puller
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - DEV_MODE=false
    volumes:
      - ./data:/usr/src/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dozzle:
    image: amir20/dozzle:latest
    container_name: tg-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Formato: "IP_TAILSCALE:PUERTO_EXTERNO:PUERTO_CONTENEDOR"
      - "100.100.38.4:8080:8080"
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_FILTER=name=peaky-puller
      - DOZZLE_BASE=/
